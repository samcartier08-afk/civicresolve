steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "$_IMAGE_NAME"
      - "--build-arg"
      - "NEXT_PUBLIC_FIREBASE_API_KEY=$_FIREBASE_API_KEY"
      - "--build-arg"
      - "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$_FIREBASE_AUTH_DOMAIN"
      - "--build-arg"
      - "NEXT_PUBLIC_FIREBASE_PROJECT_ID=$_FIREBASE_PROJECT_ID"
      - "--build-arg"
      - "NEXT_PUBLIC_FIREBASE_APP_ID=$_FIREBASE_APP_ID"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "$_IMAGE_NAME"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "civicresolve"
      - "--image"
      - "$_IMAGE_NAME"
      - "--region"
      - "asia-south1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"

images:
  - "$_IMAGE_NAME"

substitutions:
  _IMAGE_NAME: "asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/civicresolve:latest"
  _FIREBASE_API_KEY: ""
  _FIREBASE_AUTH_DOMAIN: "civil-50461.firebaseapp.com"
  _FIREBASE_PROJECT_ID: "civil-50461"
  _FIREBASE_APP_ID: ""
